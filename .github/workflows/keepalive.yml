# Pings the Render backend so the free tier does not go to sleep (a cold start adds ~30 s to the first request).
# GitHub schedules are best effort (can run a few minutes late) and pause after 60 days without repo activity.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 5 --max-time 90 https://jarvis-mobile-backend.onrender.com/api/health
